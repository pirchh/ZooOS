# Pinned toolchain for ZooOS (see DECISIONS.md, "Toolchain").
# A dated nightly is required because bootloader 0.11.17 builds its UEFI stage
# with `-Zbuild-std=core`. The kernel itself uses no unstable features.
[toolchain]
channel = "nightly-2026-10-01"
components = ["rust-src", "llvm-tools", "rustfmt", "clippy"]
targets = ["x86_64-unknown-none"]
profile = "minimal"
