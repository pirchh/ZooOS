[package]
name = "zoo-user"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# User programs for ZooOS and their runtime (docs/m3-design.md §9). Built
# by `cargo xtask build` for x86_64-unknown-none with
# `-C relocation-model=static`, then packed into the initial filesystem.

[lib]
name = "zoo_rt"
path = "src/lib.rs"
test = false
bench = false

[[bin]]
name = "zookeeper"
path = "src/bin/zookeeper.rs"
test = false
bench = false

[[bin]]
name = "lion-handler"
path = "src/bin/lion-handler.rs"
test = false
bench = false

[[bin]]
name = "hamster-handler"
path = "src/bin/hamster-handler.rs"
test = false
bench = false

[[bin]]
name = "peacock-handler"
path = "src/bin/peacock-handler.rs"
test = false
bench = false

[[bin]]
name = "owl-handler"
path = "src/bin/owl-handler.rs"
test = false
bench = false

[[bin]]
name = "chimp-handler"
path = "src/bin/chimp-handler.rs"
test = false
bench = false

[[bin]]
name = "beaver-handler"
path = "src/bin/beaver-handler.rs"
test = false
bench = false

[[bin]]
name = "elephant-handler"
path = "src/bin/elephant-handler.rs"
test = false
bench = false

[[bin]]
name = "monkey-handler"
path = "src/bin/monkey-handler.rs"
test = false
bench = false

[dependencies]
zoo-abi = { path = "../abi" }
# The inference engine (ElephantHandler).
zoo-infer = { path = "../infer" }
# Same font as the kernel console (and the verifier's screenshot checks).
noto-sans-mono-bitmap = { version = "=0.3.2", default-features = false, features = ["regular", "size_16", "unicode-basic-latin", "unicode-specials"] }
# Scancode decoding in the window server, as in the kernel shell.
pc-keyboard = "=0.9.0"
# The user heap allocator (grown with `mem_alloc`), as in the kernel.
linked_list_allocator = { version = "=0.10.6", default-features = false, features = ["use_spin"] }
