[workspace]
resolver = "3"
members = ["abi", "infer", "kernel", "user", "xtask"]
# Plain `cargo build` at the root only builds the host tool. The kernel is
# always built by `cargo xtask build` with an explicit --target.
default-members = ["xtask"]

[workspace.package]
version = "0.133.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Abort on panic everywhere: the kernel has no unwinder. (Cargo ignores this
# for build scripts and test harnesses, so host tests still work.)
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
# One unit per crate, so how fast the guest's hearing runs doesn't depend
# on how the compiler happens to split zoo-infer: an unused module made it
# twice as slow under TCG with the default 16 (DECISIONS.md, 0.132.0).
codegen-units = 1

# Inference is far too slow unoptimised; build it optimised even in dev
# profile (host tests and xtask).
[profile.dev.package.zoo-infer]
opt-level = 3

[profile.dev.package.libm]
opt-level = 3
