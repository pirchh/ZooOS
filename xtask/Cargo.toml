[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Disk-image builder. UEFI only: the BIOS path is unused and needs extra
# custom targets. Must match the kernel's bootloader_api version exactly.
bootloader = { version = "=0.11.17", default-features = false, features = ["uefi"] }
sha2 = "0.11.1"
# ustar writer for the initial filesystem (same format the kernel reads).
zoo-abi = { path = "../abi" }
# Host runs of the inference engine (checks against the reference, benchmarks).
zoo-infer = { path = "../infer" }
# Same font, version and features as the kernel console, for screenshot checks.
noto-sans-mono-bitmap = { version = "=0.3.2", default-features = false, features = ["regular", "size_16", "unicode-basic-latin", "unicode-specials"] }
